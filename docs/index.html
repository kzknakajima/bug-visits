<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>むしとり記録</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: system-ui, "Hiragino Sans", sans-serif;
        background: #f8fafc;
        color: #1e293b;
      }
      #root {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      h1 {
        font-size: 20px;
        margin: 4px 0 4px;
      }
      .stats {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 20px;
      }
      .nav {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 28px;
      }
      .nav a {
        display: block;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        text-decoration: none;
        color: #1e293b;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .nav a .emoji {
        font-size: 26px;
        display: block;
        margin-bottom: 6px;
      }
      .nav a .label {
        font-weight: 700;
        font-size: 14px;
      }
      .nav a .desc {
        font-size: 12px;
        color: #64748b;
        margin-top: 2px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      th, td {
        text-align: left;
        font-size: 13px;
        padding: 8px 10px;
        border-bottom: 1px solid #e2e8f0;
      }
      th {
        background: #f1f5f9;
        color: #475569;
        font-weight: 600;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr.clickable {
        cursor: pointer;
      }
      tr.clickable:hover td {
        background: #f8fafc;
      }
      .err {
        color: #b91c1c;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <h1>🐛 むしとり記録</h1>
      <div class="stats" id="stats">読み込み中…</div>
      <div class="nav">
        <a href="./map.html">
          <span class="emoji">🗺️</span>
          <span class="label">地図</span>
          <span class="desc">訪れた場所をピンで表示</span>
        </a>
        <a href="./zukan.html">
          <span class="emoji">🔎</span>
          <span class="label">図鑑</span>
          <span class="desc">捕まえた・見た生き物一覧</span>
        </a>
      </div>
      <table id="table">
        <thead>
          <tr><th>日付</th><th>場所</th><th>天気</th><th>捕まえた</th><th>見ただけ</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <script src="./detail.js"></script>
    <script>
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }
      function summarize(rows) {
        if (!rows || !rows.length) return "-";
        return rows.map((r) => (r.note || r.creature) + " ×" + (r.count || 1)).join(", ");
      }
      async function main() {
        const items = await window.loadBugVisits();
        const sorted = items.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
        document.getElementById("stats").textContent = sorted.length + " 回のお出かけを記録中";
        const tbody = document.getElementById("tbody");
        tbody.innerHTML = sorted
          .map(
            (it) =>
              '<tr class="clickable" data-id="' + escapeHtml(it.id) + '">' +
              "<td>" + escapeHtml(it.date || "") + "</td>" +
              "<td>" + escapeHtml(it.placeName || "") + "</td>" +
              "<td>" + escapeHtml(it.weather || "") + "</td>" +
              "<td>" + escapeHtml(summarize(it.catches)) + "</td>" +
              "<td>" + escapeHtml(summarize(it.sightings)) + "</td>" +
              "</tr>",
          )
          .join("");
        tbody.querySelectorAll("tr").forEach((tr) => {
          tr.onclick = () => window.openRecordById(tr.dataset.id);
        });
      }
      main().catch((e) => {
        document.getElementById("root").innerHTML = '<div class="err">読み込みに失敗しました: ' + (e && e.message ? e.message : e) + "</div>";
      });
    </script>
  </body>
</html>
