<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>むしとり地図</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      html, body, #map {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
      }
      #status {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        color: #64748b;
      }
      #back {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        color: #1e293b;
        text-decoration: none;
      }
      .popup-title {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 2px;
      }
      .popup-type {
        color: #64748b;
        font-size: 12px;
        margin-bottom: 6px;
      }
      .popup-visits {
        font-size: 12px;
        color: #1e293b;
        margin-bottom: 4px;
        font-weight: 600;
      }
      .popup-datelist {
        max-height: 120px;
        overflow-y: auto;
        margin-bottom: 6px;
      }
      .popup-date {
        font-size: 12px;
        color: #0369a1;
        cursor: pointer;
        text-decoration: underline;
        display: block;
        padding: 1px 0;
      }
      .popup-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .popup-btn {
        display: inline-block;
        font-size: 12px;
        background: #4285f4;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
        text-decoration: none;
      }
      .err {
        color: #b91c1c;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="status">読み込み中…</div>
    <a id="back" href="./index.html">一覧に戻る</a>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./detail.js"></script>
    <script>
      const TYPE_COLOR = {
        神社: "#dc2626",
        自然公園: "#059669",
        公園: "#2563eb",
        その他: "#7c3aed",
      };

      let map;
      let markersLayer;

      function initMap() {
        map = L.map("map").setView([35.681236, 139.767125], 10); // fallback: Tokyo Station
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
      }

      function statusEl() {
        return document.getElementById("status");
      }

      // Group visit records into one pin per place (same name + coordinates
      // rounded to ~1m so tiny float differences still merge).
      function groupByPlace(items) {
        const groups = new Map();
        for (const it of items) {
          const lat = Number(it.lat);
          const lng = Number(it.lng);
          if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
          const key = (it.placeName || "") + "|" + lat.toFixed(5) + "|" + lng.toFixed(5);
          if (!groups.has(key)) {
            groups.set(key, { placeName: it.placeName, spotType: it.spotType, lat, lng, visits: [] });
          }
          groups.get(key).visits.push({ id: it.id, date: it.date });
        }
        for (const g of groups.values()) {
          g.visits.sort((a, b) => (a.date < b.date ? 1 : -1)); // newest first
        }
        return [...groups.values()];
      }

      function render(items) {
        markersLayer.clearLayers();
        const groups = groupByPlace(items);
        const pts = [];
        for (const g of groups) {
          pts.push([g.lat, g.lng]);
          const color = TYPE_COLOR[g.spotType] || "#334155";
          const marker = L.circleMarker([g.lat, g.lng], {
            radius: 9,
            color: "#fff",
            weight: 2,
            fillColor: color,
            fillOpacity: 0.9,
          }).addTo(markersLayer);
          const gmapsUrl = "https://www.google.com/maps/search/?api=1&query=" + g.lat + "," + g.lng;
          const dateItems = g.visits
            .map((v) => '<span class="popup-date" data-id="' + escapeHtml(v.id) + '">' + escapeHtml(v.date) + "</span>")
            .join("");
          const html =
            '<div class="popup-title">' + escapeHtml(g.placeName || "") + "</div>" +
            '<div class="popup-type">' + escapeHtml(g.spotType || "") + "</div>" +
            '<div class="popup-visits">訪問回数: ' + g.visits.length + " 回</div>" +
            '<div class="popup-datelist">' + dateItems + "</div>" +
            '<div class="popup-actions">' +
            '<a class="popup-btn" href="' + gmapsUrl + '" target="_blank" rel="noopener">Googleマップで開く</a>' +
            "</div>";
          marker.bindPopup(html);
          marker.on("popupopen", (e) => {
            const el = e.popup.getElement();
            el.querySelectorAll(".popup-date").forEach((dateEl) => {
              dateEl.onclick = () => window.openRecordById(dateEl.dataset.id);
            });
          });
        }
        if (pts.length) {
          map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
        }
        statusEl().textContent = groups.length + " か所 / " + items.length + " 件の記録";
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      async function main() {
        initMap();
        const items = await window.loadBugVisits();
        render(items);
      }

      main().catch((e) => {
        document.body.innerHTML = '<div class="err">読み込みに失敗しました: ' + (e && e.message ? e.message : e) + "</div>";
      });
    </script>
  </body>
</html>
